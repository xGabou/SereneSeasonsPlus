plugins {
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT'
}
base.archivesName.set("${mod_name}-common")

minecraft {
    version(minecraft_version)
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    // Common-only compile-time deps used by shared utilities
    compileOnly "curse.maven:serene-seasons-291874:6398227"
    compileOnly "curse.maven:glitchcore-955399:5787839"      // BetterDays / GlitchCore
    compileOnly group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-common", version: "${whitenoise_version}"
    compileOnly "curse.maven:betterdays-895618:7046760"
    compileOnly "curse.maven:snow-real-magic-308663:6888541"

    compileOnly group:'org.spongepowered', name: 'mixin', version: '0.8.5'
    compileOnly "org.ow2.asm:asm:9.8"
    compileOnly "org.ow2.asm:asm-commons:9.8"
    compileOnly "org.ow2.asm:asm-tree:9.8"
    compileOnly "org.ow2.asm:asm-util:9.8"
    compileOnly "org.ow2.asm:asm-analysis:9.8"
    compileOnly "curse.maven:gabous-libs-1367332:8237907"
    compileOnly "curse.maven:dynamictrees-252818:7502488"
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

tasks.named('test', Test) {
    useJUnit()
    workingDir layout.buildDirectory.dir('test-runtime')
    doFirst { workingDir.mkdirs() }
    // Shared code references compile-only mod APIs during class loading.
    classpath += sourceSets.main.compileClasspath.filter { !it.name.contains("snow-real-magic") }
}
